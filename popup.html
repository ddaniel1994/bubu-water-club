<!doctype html><html><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="bear.css"><link rel="stylesheet" href="style.css"></head><body><main><div class="confetti" id="confetti" aria-hidden="true"></div><button class="gear" id="settingsBtn" aria-label="Open settings" aria-expanded="false">⚙</button><div class="bear" id="bear" data-tier="0"><span class="zzz" aria-hidden="true"></span><span class="spark s1" aria-hidden="true">✦</span><span class="spark s2" aria-hidden="true">✦</span></div><div class="bearnav"><button id="bearL" class="arrow" aria-label="Previous bear">‹</button><span id="bearName">Bubu</span><button id="bearR" class="arrow" aria-label="Next bear">›</button></div><p id="mood">Bubu is thirsty</p><p class="subtitle">A little sip, a happier Bubu <span class="heart">♥</span></p><section class="hydration"><div class="heading"><span>Today's hydration</span><strong id="count">0 / 8</strong></div><div class="track"><div id="progress"></div></div><button id="drink">I drank a glass!</button><div class="links"><button class="link" id="undo">Undo last glass</button></div><p id="message">Dudu is cheering for you!</p><div class="week" id="week" role="group" aria-label="Last 7 days of hydration"></div><p id="streak"></p></section><section class="settings"><p class="glabel">Reminders</p><label class="toggle"><span>Gentle reminders</span><input type="checkbox" id="enabled" class="switch"></label><div class="toggle rrow"><span>Quiet hours</span><span class="hours"><select id="quietFrom" aria-label="Quiet hours start"></select><span aria-hidden="true">–</span><select id="quietTo" aria-label="Quiet hours end"></select></span><input type="checkbox" id="quiet" class="switch"></div><div class="rrow inline"><label for="interval">Remind me every</label><select id="interval"><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option><option value="90">90 minutes</option><option value="120">2 hours</option></select></div><label class="toggle rrow"><span>Stop reminders after goal reached</span><input type="checkbox" id="stopAtGoal" class="switch"></label><p id="next" class="rrow"></p><p class="glabel">Companion</p><label class="toggle"><span>Floating Bubu</span><input type="checkbox" id="floating" class="switch"></label><p class="glabel">Daily goal</p><div class="toggle"><span>Glasses a day</span><span class="stepper"><button id="goalDown" aria-label="Decrease daily glass goal">−</button><output id="goal">8</output><button id="goalUp" aria-label="Increase daily glass goal">+</button></span></div></section></main><script src="popup.js"></script></body></html>
